[package]
name = "verbatim-widget"
version = "1.0.0"
edition = "2021"
description = "Verbatim macOS widget (M3 spike)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.2"
arboard = "3"
# Phase 3.5 — BYOK: store the vendor API key in the OS keychain (Security framework on macOS).
keyring = { version = "3", features = ["apple-native"] }
# Phase 4.3 — config store: persist non-secret settings (provider/language/hotkey/dockIcon)
# as JSON in the app config dir. Secrets live in secrets.rs (local file / keychain adapter).
tauri-plugin-store = "2"
# Settings 1.2 — "Launch at login": a real macOS login item (LaunchAgent).
tauri-plugin-autostart = "2"

# Spike A — non-activating NSPanel overlay. macOS-only; keep it target-gated so the
# widget still compiles on other platforms (which no-op the panel code below).
# v2.1 branch: adds the `tauri_panel!` macro whose `config` block can set
# `can_become_key_window: false` — the key ingredient so the overlay never steals
# the keyboard from the app underneath.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
# Phase 3.4 — read the focused element's role via the Accessibility API (ApplicationServices
# is linked directly in axinject.rs) to decide paste vs refuse vs copy.
core-foundation = "0.10"
# Bugfix (Aug 2026) — inject.rs::post_command_chord posts ⌘-chords via raw CGEvent calls
# with the Command flag explicitly stamped on the letter event itself, instead of relying
# on enigo's implicit modifier-flag inference (which intermittently dropped the flag and
# typed a literal letter over the selection instead of running the modified keystroke).
# Pinned to "0.23" to match enigo 0.2.1's own core-graphics dependency (already resolved in
# Cargo.lock) rather than introducing a third divergent version of the crate.
core-graphics = "0.23"
# P3 — wake word: download the openWakeWord ONNX models on first enable (wake.rs `ensure_models`).
# ureq's default features enable rustls TLS (HTTPS + following the GitHub release redirect).
ureq = "2"
# P3 — wake word inference: ONNX Runtime (runs the 3 openWakeWord models). `download-binaries`
# fetches a prebuilt ONNX Runtime shared lib at build time, so no system install is required.
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
# P3 — wake word audio: cross-platform capture — an INDEPENDENT always-on 16 kHz input stream,
# separate from the webview's getUserMedia dictation mic (macOS allows multiple mic clients).
cpal = "0.15"

# Keep the binary name stable for tauri.
[[bin]]
name = "verbatim-widget"
path = "src/main.rs"
