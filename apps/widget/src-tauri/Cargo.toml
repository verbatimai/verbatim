[package]
name = "open-dictation-widget"
version = "0.1.0"
edition = "2021"
description = "Open Dictation macOS widget (M3 spike)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.2"
arboard = "3"

# Keep the binary name stable for tauri.
[[bin]]
name = "open-dictation-widget"
path = "src/main.rs"
