<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Verbatim</title>
  <link rel="icon" type="image/svg+xml" href="/verbatim-logo.svg" />
  <link rel="stylesheet" href="/src/settings.css" />
  <link rel="stylesheet" href="/src/onboarding.css" />
</head>
<body class="settings-window" data-theme="system">

       particular must be created there and kept alive across re-renders (a
       pasted key is never interpolated into markup), so no key field and no
       per-screen structure is declared here. -->
  <main class="onboard" id="root"></main>
  <script type="module" src="/src/onboarding.ts"></script>
</body>
</html>
