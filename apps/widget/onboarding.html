<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Verbatim</title>
  <link rel="icon" type="image/svg+xml" href="/verbatim-logo.svg" />
  <link rel="stylesheet" href="/src/settings.css" />
  <link rel="stylesheet" href="/src/onboarding.css" />
</head>
<body class="settings-window" data-theme="system">
  <main class="onboard">
    <img class="onboard-logo" src="/verbatim-logo.svg" alt="Verbatim" width="40" height="40" />
    <h1>Welcome to Verbatim</h1>
    <p class="onboard-sub">Add an API key to start dictating. Pick whichever provider you have a key for.</p>

    <div id="vendorPicker" class="onboard-vendors">
      <button class="onboard-vendor" data-vendor="pyai">PyAI <span class="tag">Recommended</span></button>
      <button class="onboard-vendor" data-vendor="deepgram">Deepgram</button>
      <button class="onboard-vendor" data-vendor="openai">OpenAI</button>
      <button class="onboard-vendor" data-vendor="anthropic">Anthropic</button>
    </div>

    <input id="onboardKey" type="password" placeholder="Paste your API key" autocomplete="off" spellcheck="false" />
    <p id="onboardError" class="onboard-error" hidden></p>

    <div class="onboard-actions">
      <button id="onboardSkip" class="btn ghost">Skip for now</button>
      <button id="onboardSave" class="btn primary" disabled>Get started</button>
    </div>
  </main>
  <script type="module" src="/src/onboarding.ts"></script>
</body>
</html>
