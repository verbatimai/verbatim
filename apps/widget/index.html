<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Dictation — M3 spike</title>
  <style>
    /* transparent:true → the page itself is see-through; the card is the widget. */
    html, body { margin: 0; height: 100%; background: transparent; }
    body {
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e6edf3; padding: 10px; box-sizing: border-box;
    }
    .card {
      background: rgba(18, 22, 30, 0.94);
      border: 1px solid #2b3444; border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      padding: 12px 14px; height: calc(100% - 20px); box-sizing: border-box;
    }
    .hdr {
      display: flex; align-items: center; gap: 8px;
      font-weight: 650; font-size: 13px; margin-bottom: 10px;
      cursor: grab; user-select: none;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #7d8695; transition: background .15s; }
    .dot.on { background: #3fb950; box-shadow: 0 0 8px #3fb950; }
    .focus-label { margin-left: auto; font-weight: 500; color: #7d8695; font-size: 12px; }
    input {
      width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 9px;
      border: 1px solid #2b3444; background: #0d1117; color: #e6edf3; margin-bottom: 9px;
    }
    button {
      background: #4c9df0; color: #04121f; border: 0; border-radius: 9px;
      padding: 7px 11px; font-weight: 650; cursor: pointer; margin-right: 7px;
    }
    .ghost { background: #1c2230; color: #e6edf3; border: 1px solid #2b3444; }
    #status { margin-top: 10px; color: #7d8695; min-height: 18px; font-size: 12px; }
    .hint { color: #6b7480; font-size: 11px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="hdr" data-tauri-drag-region>
      <span class="dot" id="focusDot"></span>
      <span>Open Dictation — Spike A</span>
      <span class="focus-label" id="focusLabel">widget: not focused</span>
    </div>

    <!-- Spike A test: click into THIS field. If the OTHER app's caret keeps blinking
         and its title bar stays active, the non-activating panel works. -->
    <input id="text" value="Hello from the Open Dictation widget." />
    <button id="inject3">Inject after 3s</button>
    <button id="inject" class="ghost">Inject now</button>

    <div id="status"></div>
    <div class="hint">
      ⌥Space toggles the widget. Spike&nbsp;A: bring Notes/Slack to the front, then click
      this card — the other app should stay active (its caret keeps blinking). Watch the
      terminal for <code>[spike-a]</code> logs. Grant Accessibility when prompted (Spike&nbsp;B).
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
