<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Dictation — M3 spike</title>
  <style>
    body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1117;color:#e6edf3;padding:16px}
    h1{font-size:15px;margin:0 0 10px}
    input{width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #2b3444;background:#161b22;color:#e6edf3;margin-bottom:10px}
    button{background:#4c9df0;color:#04121f;border:0;border-radius:8px;padding:8px 12px;font-weight:650;cursor:pointer;margin-right:8px}
    .ghost{background:#1c2230;color:#e6edf3;border:1px solid #2b3444}
    #status{margin-top:12px;color:#7d8695;min-height:20px}
    .hint{color:#7d8695;font-size:12px;margin-top:12px}
  </style>
</head>
<body>
  <h1>Injection spike (Spike B)</h1>
  <input id="text" value="Hello from the Open Dictation widget." />
  <button id="inject3">Inject after 3s (focus another app!)</button>
  <button id="inject" class="ghost">Inject now</button>
  <div id="status"></div>
  <div class="hint">Global hotkey: ⌥Space toggles this window. Grant Accessibility permission when macOS prompts.</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
