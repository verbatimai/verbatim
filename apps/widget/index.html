<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verbatim</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="root" class="orb-view">
    <!-- Idle: a small floating orb. Click it (or press ⌥Space) to dictate. -->
    <button class="orb" id="orb" title="Dictate  (⌥Space)">
      <svg width="26" height="26" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true">
        <path d="M11 23V41"/><path d="M21 16V48"/><path d="M31 20V44"/>
        <path d="M40 22H54"/><path d="M40 32H54"/><path d="M40 42H48"/>
      </svg>
    </button>

    <!-- Active: the full card — live streaming transcript / diff / final output. -->
    <div class="card">
      <div class="titlebar" data-tauri-drag-region>
        <span class="glyph" data-tauri-drag-region aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" aria-hidden="true">
            <path d="M11 23V41"/><path d="M21 16V48"/><path d="M31 20V44"/>
            <path d="M40 22H54"/><path d="M40 32H54"/><path d="M40 42H48"/>
          </svg>
        </span>
        <span class="brand" data-tauri-drag-region>Verbatim</span>
        <span class="statuspill"><span class="dot" id="dot"></span><span id="statusText">Idle</span></span>
        <span class="level" id="level" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
        <button class="icon-btn" id="collapseBtn" title="Dismiss">✕</button>
      </div>

      <div class="banner" id="banner" hidden>
        <div class="banner-row">
          <span class="banner-dot"></span>
          <span class="banner-msg" id="bannerMsg"></span>
          <button class="banner-x" id="bannerClose" aria-label="Dismiss">✕</button>
        </div>
        <div class="banner-actions" id="bannerActions" hidden>
          <button id="openMic" class="banner-btn" hidden>Open Microphone Settings</button>
          <button id="openAx" class="banner-btn" hidden>Open Accessibility Settings</button>
          <button id="retryMic" class="banner-btn ghost" hidden>Retry</button>
          <button id="copyErr" class="banner-btn ghost" hidden>Copy details</button>
        </div>
        <div class="banner-log" id="bannerLog" hidden></div>
      </div>

      <div class="body">
        <div class="lbl"><span>Live preview · rough, catches up as you speak</span></div>
        <div class="transcript" id="transcript">
          <span class="hint">Press <b>Demo</b> to replay a sample, or <b>Start</b> to dictate. ⌥Space toggles the widget.</span>
        </div>

        <div class="final">
          <div class="lbl">
            <span>Final output · clean &amp; inserted into the focused field</span>
            <button id="copyBtn" class="copy-btn" disabled>Copy</button>
          </div>
          <div class="txt" id="finalOut"></div>
        </div>

        <div class="controls">
          <button id="demo" class="primary">▶&nbsp;Demo</button>
          <button id="start" class="ghost">🎙&nbsp;Start</button>
          <button id="stop" class="ghost" disabled>■&nbsp;Stop</button>
          <label class="toggle"><input type="checkbox" id="showRemoved" checked /> show removed</label>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
